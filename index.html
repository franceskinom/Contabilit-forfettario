<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaxSaver</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 14px; max-width: 520px; margin: 0 auto; }
    .stack { display: flex; flex-direction: column; gap: 14px; }
    .hidden { display: none !important; }
    .card { background: #1e293b; border-radius: 14px; padding: 16px; border: 1px solid #334155; }
    .hero { background: linear-gradient(135deg, #132d3f, #0f1f2e); border: 1px solid #0284c7; }
    .title { font-size: 13px; font-weight: bold; color: #38bdf8; text-transform: uppercase; margin-bottom: 6px; }
    .big-num { font-size: 32px; font-weight: 800; color: #fff; margin-bottom: 10px; }
    .sub-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; border-top: 1px solid #334155; padding-top: 10px; font-size: 12px; }
    .sub-grid div { display: flex; flex-direction: column; }
    .sub-grid span { font-weight: bold; font-size: 14px; margin-top: 2px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; font-weight: 600; }
    input, select { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 16px; outline: none; color-scheme: dark; min-height: 46px; }
    input[type="date"] { -webkit-appearance: none; appearance: none; display: block; }
    input:focus, select:focus { border-color: #10b981; }
    .btn { width: 100%; background: #10b981; color: #0f172a; font-weight: bold; font-size: 16px; border: none; padding: 14px; border-radius: 10px; cursor: pointer; }
    .btn:active { opacity: 0.8; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .msg { font-size: 12px; margin-top: 8px; min-height: 16px; }
    .invoice-item { background: #0f172a; border-radius: 10px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1px solid #334155; }
    .invoice-item .info { font-size: 12px; color: #94a3b8; min-width: 0; }
    .invoice-item .info b { color: #fff; font-size: 15px; display: block; }
    .del-btn { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; flex-shrink: 0; }
    .scad-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
    .scad-box { background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #334155; }
    .scad-box h4 { font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
    .scad-box span { font-size: 16px; font-weight: bold; color: #38bdf8; }
    .small-btn { background: #334155; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; }
    .empty { font-size: 13px; color: #64748b; text-align: center; padding: 10px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #94a3b8; gap: 10px; }
    .topbar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .banner { background: #422006; border: 1px solid #f59e0b; border-radius: 12px; padding: 12px; font-size: 13px; }
    .banner button { margin-top: 8px; background: #f59e0b; color: #0f172a; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="view-login" class="stack hidden">
    <div class="card" style="margin-top:40px;">
      <div class="title" style="color:#10b981;">TaxSaver · Accedi</div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" inputmode="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password">
      </div>
      <button type="button" class="btn" id="btn-login">Accedi</button>
      <div class="msg" id="login-msg"></div>
    </div>
  </div>

  <!-- APP -->
  <div id="view-app" class="stack hidden">

    <div class="topbar">
      <span id="user-email"></span>
      <button type="button" class="small-btn" id="btn-logout">Esci</button>
    </div>

    <div id="migrate-banner" class="banner hidden">
      <div id="migrate-text"></div>
      <button type="button" id="btn-migrate">Importa nel cloud</button>
    </div>

    <div class="card" style="display:flex; align-items:center; gap:12px;">
      <div style="flex:0 0 110px;"><label for="anno">Anno</label><select id="anno"></select></div>
      <div id="anno-nota" style="font-size:12px; color:#94a3b8;"></div>
    </div>

    <div class="card hero">
      <div class="title">Totale da Accantonare</div>
      <div class="big-num" id="tot-acc">0,00 €</div>
      <div id="coeff-badge" style="font-size:12px; color:#94a3b8; margin:-6px 0 10px;"></div>
      <div class="sub-grid">
        <div><em id="lbl-inps" style="font-style:normal">INPS</em><span id="tot-inps" style="color:#38bdf8;">0,00 €</span></div>
        <div><em id="lbl-imposta" style="font-style:normal">Imposta</em><span id="tot-imposta" style="color:#f59e0b;">0,00 €</span></div>
        <div>Bolli (2€)<span id="tot-bolli" style="color:#a855f7;">0,00 €</span></div>
      </div>
    </div>

    <div class="card">
      <div class="title" style="color:#10b981;">Scadenze F24 (Saldo + Acconti)</div>
      <div class="scad-grid">
        <div class="scad-box"><h4>Giugno (Saldo + 50%)</h4><span id="scad-giu">0,00 €</span></div>
        <div class="scad-box"><h4>Novembre (50%)</h4><span id="scad-nov">0,00 €</span></div>
      </div>
      <div style="font-size:11px; color:#94a3b8; margin-top:8px;">
        Soglia Forfettario: <strong id="tot-fatturato" style="color:#fff;">0,00 €</strong> / 85.000 €
      </div>
    </div>

    <div class="card">
      <div class="title" style="color:#10b981;">Registra Nuova Fattura</div>
      <div class="form-group">
        <label for="amount">Importo Lordo (€)</label>
        <input type="text" id="amount" placeholder="Es. 2294,13" inputmode="decimal" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="desc">Descrizione / Cliente</label>
        <input type="text" id="desc" placeholder="Descrizione lavoro" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="date">Data Incasso</label>
        <input type="date" id="date">
      </div>
      <div class="form-group">
        <label for="bollo">Marca da Bollo (2 €)</label>
        <select id="bollo">
          <option value="auto">Automatica (&gt; 77,47 €)</option>
          <option value="yes">Sì (addebito)</option>
          <option value="no">No</option>
        </select>
      </div>
      <button type="button" class="btn" id="btn-salva">Registra Fattura</button>
      <div class="msg" id="msg"></div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div class="title" style="margin:0;" id="titolo-lista">Elenco Fatture</div>
        <button type="button" class="small-btn" id="btn-csv">Scarica CSV</button>
      </div>
      <div id="lista-fatture"></div>
    </div>

    <div class="card">
      <div class="title" style="color:#10b981;">Grafici</div>
      <label>Per anno: fatturato (azzurro) e tasse (arancione)</label>
      <div id="chart-anni"></div>
      <label style="margin-top:14px;">Per mese, nell'anno selezionato</label>
      <div id="chart-mesi"></div>
    </div>

    <div class="card">
      <div class="title">Impostazioni</div>
      <div class="form-group"><label for="set-coeff">Coefficiente di redditività (%)</label><input type="text" id="set-coeff" inputmode="decimal"></div>
      <div class="form-group"><label for="set-imposta">Imposta sostitutiva (%) · 5 nuova attività, 15 ordinaria</label><input type="text" id="set-imposta" inputmode="decimal"></div>
      <div class="form-group"><label for="set-inps">Aliquota INPS (%)</label><input type="text" id="set-inps" inputmode="decimal"></div>
      <button type="button" class="btn" id="btn-set">Salva impostazioni</button>
      <div class="msg" id="set-msg"></div>
    </div>
  </div>

  <div id="view-error" class="card hidden" style="margin-top:40px; color:#fca5a5; font-size:14px;"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
      from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
             collection, doc, addDoc, deleteDoc, onSnapshot, writeBatch, query, setDoc }
      from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    // ============================================================
    //  INCOLLA QUI IL TUO firebaseConfig (da Firebase Console)
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyCfRgvQeO3uViYcMeTy9asQjqL4foU3-Tc",
      authDomain: "contabilita-56b30.firebaseapp.com",
      projectId: "contabilita-56b30",
      storageBucket: "contabilita-56b30.firebasestorage.app",
      messagingSenderId: "388326738041",
      appId: "1:388326738041:web:92689dc05ca3b7a3fc6ca8"
    };
    // ============================================================

    const $ = (id) => document.getElementById(id);
    const LOCAL_KEY = 'ts_f';

    function show(view) {
      ['view-login', 'view-app', 'view-error'].forEach(v => $(v).classList.toggle('hidden', v !== view));
    }

    if (!firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf('INCOLLA') === 0) {
      $('view-error').textContent = 'Configurazione Firebase mancante: incolla il tuo firebaseConfig in index.html.';
      show('view-error');
      throw new Error('firebaseConfig mancante');
    }

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = initializeFirestore(app, {
      localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
    });

    let fatture = [];
    let uid = null;
    let unsub = null;

    // ---------- utilità ----------
    const eur = (n) => n.toLocaleString('it-IT', { style: 'currency', currency: 'EUR' });

    function getOggi() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function parseImporto(str) {
      let s = String(str).trim().replace(/\s/g, '').replace('€', '');
      if (s.indexOf(',') !== -1) s = s.replace(/\./g, '').replace(',', '.');
      const n = parseFloat(s);
      return isNaN(n) ? NaN : n;
    }

    function formatData(iso) {
      const p = String(iso).split('-');
      return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function mostraMsg(testo, errore) {
      const el = $('msg');
      el.textContent = testo;
      el.style.color = errore ? '#ef4444' : '#10b981';
    }

    function colFatture() { return collection(db, 'users', uid, 'fatture'); }

    // ---------- impostazioni, calcoli e rendering ----------
    const ANNO_APERTURA = 2026;                       // partita IVA aperta il 21/09/2026
    const DEF = { coeff: 78, imposta: 5, inps: 24 };
    let sett = { ...DEF };
    let annoSel = new Date().getFullYear();
    let unsubSet = null;

    const annoDi = (f) => parseInt(String(f.data).slice(0, 4)) || ANNO_APERTURA;
    const meseDi = (f) => parseInt(String(f.data).slice(5, 7)) || 0;
    const pct = (n) => String(n).replace('.', ',') + '%';
    const compatto = (n) => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace('.', ',') + 'k' : String(Math.round(n));

    function calcola(lista) {
      const totale = lista.reduce((a, f) => a + f.importo, 0);
      const bolli = lista.filter(f => f.bollo).length * 2.0;
      const imponibile = totale * sett.coeff / 100;
      const inps = imponibile * sett.inps / 100;
      const imposta = Math.max(0, imponibile - inps) * sett.imposta / 100;
      const acconto = inps + imposta;
      return { totale, bolli, imponibile, inps, imposta, acc: acconto + bolli,
               giu: acconto * 1.5 + bolli, nov: acconto * 0.5 };
    }

    function aggiorna() {
      const anni = new Set([ANNO_APERTURA, new Date().getFullYear(), annoSel]);
      fatture.forEach(f => anni.add(annoDi(f)));
      $('anno').innerHTML = [...anni].sort().map(a =>
        '<option value="' + a + '"' + (a === annoSel ? ' selected' : '') + '>' + a + '</option>').join('');

      const lista = fatture.filter(f => annoDi(f) === annoSel);
      const r = calcola(lista);

      $('tot-acc').textContent = eur(r.acc);
      $('tot-inps').textContent = eur(r.inps);
      $('tot-imposta').textContent = eur(r.imposta);
      $('tot-bolli').textContent = eur(r.bolli);
      $('scad-giu').textContent = eur(r.giu);
      $('scad-nov').textContent = eur(r.nov);
      $('tot-fatturato').textContent = eur(r.totale);
      $('tot-fatturato').style.color = r.totale > 85000 ? '#ef4444' : r.totale > 68000 ? '#f59e0b' : '#fff';
      $('lbl-inps').textContent = 'INPS (' + pct(sett.inps) + ')';
      $('lbl-imposta').textContent = 'Imposta (' + pct(sett.imposta) + ')';
      $('coeff-badge').textContent = 'Coefficiente ' + pct(sett.coeff) + ' · imponibile ' + eur(r.imponibile);
      $('anno-nota').textContent = 'Tasse di competenza ' + annoSel + '. F24 di giugno e novembre ' + (annoSel + 1) + '.';
      $('titolo-lista').textContent = 'Fatture ' + annoSel;

      renderLista(lista);
      renderGrafici();
    }

    function renderLista(lista) {
      const cont = $('lista-fatture');
      cont.innerHTML = '';
      if (lista.length === 0) {
        cont.innerHTML = '<div class="empty">Nessuna fattura in questo anno</div>';
        return;
      }
      lista.slice().sort((a, b) => (b.data > a.data ? 1 : b.data < a.data ? -1 : 0)).forEach(f => {
        const row = document.createElement('div');
        row.className = 'invoice-item';
        row.innerHTML = '<div class="info"><b>' + eur(f.importo) + '</b>' +
          escapeHtml(f.desc || 'Senza descrizione') + ' · ' + formatData(f.data) +
          (f.bollo ? ' · bollo' : '') + '</div>';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'del-btn';
        btn.textContent = 'Elimina';
        btn.addEventListener('click', async () => {
          if (!confirm('Eliminare questa fattura?')) return;
          try { await deleteDoc(doc(db, 'users', uid, 'fatture', f.id)); }
          catch (e) { mostraMsg('Errore eliminazione: ' + e.message, true); }
        });
        row.appendChild(btn);
        cont.appendChild(row);
      });
    }

    // ---------- grafici (SVG) ----------
    function barre(labels, serie) {
      const W = 360, H = 190, L = 34, B = 20, T = 10;
      const max = Math.max(1, ...serie.flatMap(s => s.v));
      const gw = (W - L) / labels.length, bw = Math.min(22, gw / (serie.length + 1));
      let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="display:block">';
      for (let i = 0; i <= 4; i++) {
        const y = T + (H - T - B) * (1 - i / 4);
        s += '<line x1="' + L + '" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="#334155" stroke-width="0.5"/>' +
             '<text x="' + (L - 4) + '" y="' + (y + 3) + '" fill="#94a3b8" font-size="9" text-anchor="end">' + compatto(max * i / 4) + '</text>';
      }
      labels.forEach((lab, i) => {
        const x0 = L + gw * i + (gw - bw * serie.length) / 2;
        serie.forEach((se, j) => {
          const h = (H - T - B) * se.v[i] / max;
          s += '<rect x="' + (x0 + bw * j) + '" y="' + (H - B - h) + '" width="' + (bw - 1) + '" height="' + h + '" fill="' + se.c + '" rx="2"/>';
        });
        s += '<text x="' + (L + gw * i + gw / 2) + '" y="' + (H - 6) + '" fill="#94a3b8" font-size="10" text-anchor="middle">' + lab + '</text>';
      });
      return s + '</svg>';
    }

    function renderGrafici() {
      const fine = Math.max(new Date().getFullYear(), ...fatture.map(annoDi));
      const anni = [];
      for (let a = ANNO_APERTURA; a <= fine; a++) anni.push(a);
      const per = anni.map(a => calcola(fatture.filter(f => annoDi(f) === a)));
      $('chart-anni').innerHTML = barre(anni.map(String), [
        { c: '#38bdf8', v: per.map(r => r.totale) },
        { c: '#f59e0b', v: per.map(r => r.acc) }]);

      const mesi = 'GFMAMGLASOND'.split('');
      const pm = mesi.map((_, m) => calcola(fatture.filter(f => annoDi(f) === annoSel && meseDi(f) === m + 1)));
      $('chart-mesi').innerHTML = barre(mesi, [
        { c: '#38bdf8', v: pm.map(r => r.totale) },
        { c: '#f59e0b', v: pm.map(r => r.acc) }]);
    }

    // ---------- impostazioni (sincronizzate su Firestore) ----------
    function avviaSettings() {
      if (unsubSet) unsubSet();
      unsubSet = onSnapshot(doc(db, 'users', uid, 'impostazioni', 'config'), (snap) => {
        sett = { ...DEF, ...(snap.exists() ? snap.data() : {}) };
        $('set-coeff').value = String(sett.coeff).replace('.', ',');
        $('set-imposta').value = String(sett.imposta).replace('.', ',');
        $('set-inps').value = String(sett.inps).replace('.', ',');
        aggiorna();
      }, () => {});
    }

    $('btn-set').addEventListener('click', async () => {
      const n = { coeff: parseImporto($('set-coeff').value), imposta: parseImporto($('set-imposta').value), inps: parseImporto($('set-inps').value) };
      const el = $('set-msg');
      if (Object.values(n).some(x => isNaN(x) || x < 0 || x > 100) || n.coeff <= 0) {
        el.style.color = '#ef4444'; el.textContent = 'Valori non validi (ammessi da 0 a 100).'; return;
      }
      try {
        await setDoc(doc(db, 'users', uid, 'impostazioni', 'config'), n);
        el.style.color = '#10b981';
        el.textContent = 'Salvato ✓ Coefficiente ' + pct(n.coeff) + ', imposta ' + pct(n.imposta) + ', INPS ' + pct(n.inps);
      } catch (e) { el.style.color = '#ef4444'; el.textContent = 'Errore: ' + e.message; }
    });

    $('anno').addEventListener('change', (e) => { annoSel = parseInt(e.target.value); aggiorna(); });

    // ---------- sincronizzazione ----------
    function avviaSync() {
      avviaSettings();
      if (unsub) unsub();
      unsub = onSnapshot(query(colFatture()), (snap) => {
        fatture = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        aggiorna();
        controllaMigrazione();
      }, (err) => {
        mostraMsg('Errore di sincronizzazione: ' + err.message, true);
      });
    }

    // ---------- migrazione dati locali ----------
    function leggiLocali() {
      try {
        const arr = JSON.parse(localStorage.getItem(LOCAL_KEY));
        return Array.isArray(arr) ? arr.filter(f => f && typeof f.importo === 'number') : [];
      } catch (e) { return []; }
    }

    function controllaMigrazione() {
      const locali = leggiLocali();
      $('migrate-banner').classList.toggle('hidden', locali.length === 0);
      if (locali.length) {
        $('migrate-text').textContent = 'Ho trovato ' + locali.length + ' fatture salvate solo in questo browser. Vuoi importarle nel cloud?';
      }
    }

    $('btn-migrate').addEventListener('click', async () => {
      const locali = leggiLocali();
      if (!locali.length) return;
      $('btn-migrate').disabled = true;
      try {
        for (let i = 0; i < locali.length; i += 400) {
          const batch = writeBatch(d
