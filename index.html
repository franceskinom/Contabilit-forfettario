<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaxSaver</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
    .card { background: #1e293b; border-radius: 14px; padding: 16px; border: 1px solid #334155; }
    .hero { background: linear-gradient(135deg, #132d3f, #0f1f2e); border: 1px solid #0284c7; }
    .title { font-size: 13px; font-weight: bold; color: #38bdf8; text-transform: uppercase; margin-bottom: 6px; }
    .big-num { font-size: 32px; font-weight: 800; color: #fff; margin-bottom: 10px; }
    .sub-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; border-top: 1px solid #334155; padding-top: 10px; font-size: 12px; }
    .sub-grid div { display: flex; flex-direction: column; }
    .sub-grid span { font-weight: bold; font-size: 14px; margin-top: 2px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; font-weight: 600; }
    input, select { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 15px; outline: none; }
    input:focus { border-color: #10b981; }
    .btn { width: 100%; background: #10b981; color: #0f172a; font-weight: bold; font-size: 16px; border: none; padding: 14px; border-radius: 10px; cursor: pointer; }
    .btn:active { opacity: 0.8; }
    .invoice-item { background: #0f172a; border-radius: 10px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
    .del-btn { background: #ef4444; color: white; border: none; padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    .scad-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
    .scad-box { background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #334155; }
    .scad-box h4 { font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
    .scad-box span { font-size: 16px; font-weight: bold; color: #38bdf8; }
  </style>
</head>
<body>

  <!-- SCHEDA ACCANTONAMENTO -->
  <div class="card hero">
    <div class="title">Totale da Accantonare</div>
    <div class="big-num" id="tot-acc">0,00 €</div>
    <div class="sub-grid">
      <div>INPS (24%)<span id="tot-inps" style="color: #38bdf8;">0,00 €</span></div>
      <div>Imposta (5%)<span id="tot-imposta" style="color: #f59e0b;">0,00 €</span></div>
      <div>Bolli (2€)<span id="tot-bolli" style="color: #a855f7;">0,00 €</span></div>
    </div>
  </div>

  <!-- SCADENZE F24 -->
  <div class="card">
    <div class="title" style="color: #10b981;">Scadenze F24 (Saldo + Acconti)</div>
    <div class="scad-grid">
      <div class="scad-box">
        <h4>Giugno (Saldo + 50%)</h4>
        <span id="scad-giu">0,00 €</span>
      </div>
      <div class="scad-box">
        <h4>Novembre (50%)</h4>
        <span id="scad-nov">0,00 €</span>
      </div>
    </div>
    <div style="font-size: 11px; color: #94a3b8; margin-top: 8px;">
      Soglia Forfettario: <strong id="tot-fatturato" style="color:#fff;">0,00 €</strong> / 85.000 €
    </div>
  </div>

  <!-- REGISTRAZIONE -->
  <div class="card">
    <div class="title" style="color: #10b981;">Registra Nuova Fattura</div>
    
    <div class="form-group">
      <label>Importo Lordo (€)</label>
      <input type="text" id="amount" placeholder="Es. 2294.13" inputmode="decimal">
    </div>

    <div class="form-group">
      <label>Descrizione / Cliente</label>
      <input type="text" id="desc" placeholder="Descrizione lavoro">
    </div>

    <div class="form-group">
      <label>Data Incasso</label>
      <input type="date" id="date">
    </div>

    <div class="form-group">
      <label>Marca da Bollo (2 €)</label>
      <select id="bollo">
        <option value="auto">Automatica (> 77,47 €)</option>
        <option value="yes">Sì (addebito)</option>
        <option value="no">No</option>
      </select>
    </div>

    <button type="button" class="btn" id="btn-salva">Registra Fattura</button>
  </div>

  <!-- LISTA FATTURE -->
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <div class="title" style="margin:0;">Elenco Fatture</div>
      <button onclick="esportaCSV()" style="background:#334155; color:#fff; border:none; padding:4px 8px; border-radius:4px; font-size:11px; cursor:pointer;">Scarica CSV</button>
    </div>
    <div id="lista-fatture"></div>
  </div>

  <script>
    let fatture = [];
    try {
      fatture = JSON.parse(localStorage.getItem('ts_f')) || [];
    } catch(e) { fatture = []; }

    function getOggi() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function aggiorna() {

      const bolli = fatture.filter(f => f.bollo).length * 2.0;

      const inps = imponibile * 0.24;   // INPS Separata 24%

      const acconto = inps + imposta;

      const rataNov = acconto * 0.5;
